<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img"><rect width="420" height="200" fill="#97FEED"/>
<text x="210" y="26" fill="#1A1410" font-size="15" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Cite vs plagiarism</text>
<rect x="30" y="55" width="160" height="90" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/>
<text x="110" y="90" fill="#97FEED" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Cite</text>
<text x="110" y="115" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">credit source</text>
<text x="110" y="133" fill="#97FEED" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">quote / paraphrase</text>
<rect x="230" y="55" width="160" height="90" rx="4" fill="#071952" stroke="#1A1410" stroke-width="2"/>
<text x="310" y="90" fill="#97FEED" font-size="13" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Plagiarism</text>
<text x="310" y="115" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">present others'</text>
<text x="310" y="133" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">work as yours</text>
</svg>
