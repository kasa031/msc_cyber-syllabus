<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" role="img"><rect width="440" height="200" fill="#FFF1D1"/>
<text x="220" y="28" fill="#1A1410" font-size="15" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Integrity: cryptographic hash</text>
<rect x="30" y="55" width="140" height="70" rx="4" fill="#FFE8B8" stroke="#1A1410" stroke-width="2"/>
<text x="100" y="85" fill="#1A1410" font-size="13" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">file.bin</text>
<text x="100" y="105" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">bytes…</text>
<line x1="170" y1="90" x2="210" y2="90" stroke="#1A1410" stroke-width="2"/>
<rect x="210" y="55" width="90" height="70" rx="4" fill="#00B7CD" stroke="#1A1410" stroke-width="2"/>
<text x="255" y="95" fill="#FFFBF0" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">SHA-256</text>
<line x1="300" y1="90" x2="340" y2="90" stroke="#1A1410" stroke-width="2"/>
<rect x="340" y="55" width="80" height="70" rx="4" fill="#FF9100" stroke="#1A1410" stroke-width="2"/>
<text x="380" y="90" fill="#1A1410" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">digest</text>
<text x="220" y="160" fill="#DF301C" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Any bit flip → completely new fingerprint</text>
</svg>
