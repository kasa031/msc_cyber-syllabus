<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img"><rect width="360" height="280" fill="#97FEED"/>
<text x="180" y="24" fill="#1A1410" font-size="13" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Risk = impact × likelihood</text>
<text x="40" y="150" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Impact</text>
<!-- rotate label via transform -->
<rect x="80" y="50" width="55" height="55" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/><rect x="140" y="50" width="55" height="55" rx="4" fill="#0B666A" stroke="#1A1410" stroke-width="2"/><rect x="200" y="50" width="55" height="55" rx="4" fill="#071952" stroke="#1A1410" stroke-width="2"/>
<rect x="80" y="110" width="55" height="55" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/><rect x="140" y="110" width="55" height="55" rx="4" fill="#0B666A" stroke="#1A1410" stroke-width="2"/><rect x="200" y="110" width="55" height="55" rx="4" fill="#071952" stroke="#1A1410" stroke-width="2"/>
<rect x="80" y="170" width="55" height="55" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/><rect x="140" y="170" width="55" height="55" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/><rect x="200" y="170" width="55" height="55" rx="4" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
<text x="180" y="250" fill="#3D342C" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Likelihood →</text>
<text x="107" y="82" fill="#1A1410" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">M</text><text x="167" y="82" fill="#1A1410" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">H</text><text x="227" y="82" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">C</text>
<text x="280" y="80" fill="#071952" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">Critical</text>
<text x="280" y="140" fill="#0B666A" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">High</text>
<text x="280" y="200" fill="#35A29F" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">Med/Low</text>
</svg>
