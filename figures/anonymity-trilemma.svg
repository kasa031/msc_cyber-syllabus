<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img"><rect width="400" height="240" fill="#FFF1D1"/>
<text x="200" y="24" fill="#1A1410" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Anonymity trilemma</text>
<circle cx="200" cy="90" r="40" fill="#00B7CD" stroke="#1A1410" stroke-width="2"/><text x="200" y="95" fill="#FFFBF0" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Strong</text>
<text x="200" y="112" fill="#FFF1D1" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">anon.</text>
<circle cx="110" cy="180" r="40" fill="#FF9100" stroke="#1A1410" stroke-width="2"/><text x="110" y="185" fill="#1A1410" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Low</text><text x="110" y="200" fill="#3D342C" font-size="10" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">latency</text>
<circle cx="290" cy="180" r="40" fill="#DF301C" stroke="#1A1410" stroke-width="2"/><text x="290" y="185" fill="#FFFBF0" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Low</text><text x="290" y="200" fill="#FFF1D1" font-size="9" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">bandwidth</text>
<line x1="175" y1="120" x2="140" y2="150" stroke="#3D342C" stroke-width="2"/>
<line x1="225" y1="120" x2="260" y2="150" stroke="#3D342C" stroke-width="2"/>
<line x1="150" y1="180" x2="250" y2="180" stroke="#3D342C" stroke-width="2"/>
<text x="200" y="230" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Pick two - hard to get all three</text>
</svg>
