<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Research process: question, search, assess, write, cite">
  <rect width="560" height="250" fill="#97FEED"/>
  <text x="280" y="28" fill="#1A1410" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Research communication process</text>
  <rect x="15" y="55" width="95" height="70" rx="6" fill="#35A29F" stroke="#1A1410" stroke-width="2"/>
  <text x="62" y="85" fill="#97FEED" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">1. Question</text>
  <text x="62" y="105" fill="#97FEED" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">focus RQ</text>
  <path d="M112 90 H128" stroke="#1A1410" stroke-width="2"/>
  <rect x="130" y="55" width="95" height="70" rx="6" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
  <text x="177" y="85" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">2. Search</text>
  <text x="177" y="105" fill="#3D342C" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">databases</text>
  <path d="M227 90 H243" stroke="#1A1410" stroke-width="2"/>
  <rect x="245" y="55" width="95" height="70" rx="6" fill="#35A29F" stroke="#1A1410" stroke-width="2"/>
  <text x="292" y="85" fill="#97FEED" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">3. Assess</text>
  <text x="292" y="105" fill="#97FEED" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">quality</text>
  <path d="M342 90 H358" stroke="#1A1410" stroke-width="2"/>
  <rect x="360" y="55" width="95" height="70" rx="6" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
  <text x="407" y="85" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">4. Write</text>
  <text x="407" y="105" fill="#3D342C" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">IMRaD / essay</text>
  <path d="M457 90 H473" stroke="#1A1410" stroke-width="2"/>
  <rect x="475" y="55" width="70" height="70" rx="6" fill="#071952" stroke="#1A1410" stroke-width="2"/>
  <text x="510" y="85" fill="#97FEED" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">5. Cite</text>
  <text x="510" y="105" fill="#97FEED" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">APA</text>
  <rect x="30" y="150" width="500" height="75" rx="6" fill="#ffffff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="280" y="178" fill="#1A1410" font-size="13" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">ACIT4100 focus</text>
  <text x="280" y="202" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Find, evaluate and credit research sources - do not invent new empirical findings.</text>
</svg>