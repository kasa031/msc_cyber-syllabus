<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="pwd in Linux and PowerShell">
  <rect width="640" height="280" fill="#FFF1D1"/>
  <text x="320" y="24" fill="#1A1410" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Where am I? Use pwd</text>
  <!-- Linux window -->
  <rect x="16" y="40" width="300" height="200" rx="8" fill="#1e1e1e"/>
  <rect x="16" y="40" width="300" height="26" rx="8" fill="#2d2d2d"/>
  <rect x="16" y="58" width="300" height="8" fill="#2d2d2d"/>
  <circle cx="32" cy="53" r="4" fill="#DF301C"/>
  <circle cx="46" cy="53" r="4" fill="#FF9100"/>
  <circle cx="60" cy="53" r="4" fill="#00B7CD"/>
  <text x="166" y="57" fill="#c8c8c8" font-size="10" font-family="Consolas, monospace" text-anchor="middle">Linux / Arch terminal</text>
  <text x="30" y="90" fill="#00B7CD" font-size="13" font-family="Consolas, monospace">student@lab:~$ pwd</text>
  <text x="30" y="118" fill="#FFF1D1" font-size="14" font-weight="700" font-family="Consolas, monospace">/home/student</text>
  <text x="30" y="150" fill="#888" font-size="11" font-family="Consolas, monospace"># prints current folder</text>
  <!-- PowerShell window -->
  <rect x="324" y="40" width="300" height="200" rx="8" fill="#012456"/>
  <rect x="324" y="40" width="300" height="26" rx="8" fill="#0a3a6e"/>
  <rect x="324" y="58" width="300" height="8" fill="#0a3a6e"/>
  <circle cx="340" cy="53" r="4" fill="#DF301C"/>
  <circle cx="354" cy="53" r="4" fill="#FF9100"/>
  <circle cx="368" cy="53" r="4" fill="#00B7CD"/>
  <text x="474" y="57" fill="#c8c8c8" font-size="10" font-family="Consolas, monospace" text-anchor="middle">Windows PowerShell</text>
  <text x="338" y="90" fill="#FF9100" font-size="12" font-family="Consolas, monospace">PS C:\Users\student&gt; pwd</text>
  <text x="338" y="118" fill="#FFF1D1" font-size="13" font-weight="700" font-family="Consolas, monospace">C:\Users\student</text>
  <text x="338" y="150" fill="#9dc3e6" font-size="11" font-family="Consolas, monospace"># same idea: Get-Location</text>
  <text x="320" y="265" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Same command name on both systems (PowerShell alias for Get-Location)</text>
</svg>