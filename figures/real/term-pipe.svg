<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 232" width="520" height="232" role="img" aria-label="student@lab: ~/lab">
  <defs>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="520" height="232" fill="#FFF1D1"/>
  <rect x="12" y="12" width="496" height="208" rx="8" fill="#1e1e1e" filter="url(#sh)"/>
  <rect x="12" y="12" width="496" height="28" rx="8" fill="#2d2d2d"/>
  <rect x="12" y="32" width="496" height="8" fill="#2d2d2d"/>
  <circle cx="28" cy="26" r="5" fill="#DF301C"/>
  <circle cx="46" cy="26" r="5" fill="#FF9100"/>
  <circle cx="64" cy="26" r="5" fill="#00B7CD"/>
  <text x="260" y="30" fill="#c8c8c8" font-size="11" font-family="Consolas, 'Courier New', monospace" text-anchor="middle">student@lab: ~/lab</text>
  <text x="28" y="52" fill="#00B7CD" font-size="13" font-family="Consolas, 'Courier New', monospace">student@lab:~/lab$ ls | grep .txt</text>
  <text x="28" y="74" fill="#FFF1D1" font-size="13" font-weight="700" font-family="Consolas, 'Courier New', monospace">notes.txt</text>
  <text x="28" y="96" fill="#00B7CD" font-size="13" font-family="Consolas, 'Courier New', monospace">student@lab:~/lab$ cat notes.txt | wc -l</text>
  <text x="28" y="118" fill="#FFF1D1" font-size="13" font-weight="700" font-family="Consolas, 'Courier New', monospace">12</text>
  <text x="28" y="140" fill="#d4d4d4" font-size="13" font-family="Consolas, 'Courier New', monospace"></text>
  <text x="28" y="162" fill="#d4d4d4" font-size="13" font-family="Consolas, 'Courier New', monospace"># Pipe | sends output of left command</text>
  <text x="28" y="184" fill="#d4d4d4" font-size="13" font-family="Consolas, 'Courier New', monospace"># into the next command as input</text>
</svg>
