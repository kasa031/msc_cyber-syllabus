<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280" role="img" aria-label="Tor onion routing: layered encryption through relays">
  <rect width="580" height="280" fill="#97FEED"/>
  <text x="290" y="26" fill="#1A1410" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Tor: onion routing (layered encryption)</text>
  <rect x="20" y="50" width="100" height="70" rx="6" fill="#35A29F" stroke="#1A1410" stroke-width="2"/>
  <text x="70" y="80" fill="#97FEED" font-size="13" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">You</text>
  <text x="70" y="100" fill="#97FEED" font-size="11" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">(client)</text>
  <path d="M125 85 H155" stroke="#1A1410" stroke-width="2"/>
  <text x="140" y="75" fill="#071952" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">encrypt</text>
  <ellipse cx="210" cy="85" rx="48" ry="38" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
  <text x="210" y="80" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Entry</text>
  <text x="210" y="96" fill="#3D342C" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">relay</text>
  <path d="M260 85 H290" stroke="#1A1410" stroke-width="2"/>
  <ellipse cx="340" cy="85" rx="48" ry="38" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
  <text x="340" y="80" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Middle</text>
  <text x="340" y="96" fill="#3D342C" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">relay</text>
  <path d="M390 85 H420" stroke="#1A1410" stroke-width="2"/>
  <ellipse cx="470" cy="85" rx="48" ry="38" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
  <text x="470" y="80" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Exit</text>
  <text x="470" y="96" fill="#3D342C" font-size="10" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">relay</text>
  <path d="M520 85 H545" stroke="#1A1410" stroke-width="2"/>
  <rect x="20" y="150" width="540" height="110" rx="6" fill="#ffffff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="290" y="178" fill="#1A1410" font-size="13" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">What this means</text>
  <text x="290" y="202" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Traffic is wrapped in layers (like an onion). Each relay peels one layer.</text>
  <text x="290" y="222" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">No single relay sees both who you are AND the final website.</text>
  <text x="290" y="242" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Goal: anonymity / unlinkability for browsing (low-latency network).</text>
</svg>