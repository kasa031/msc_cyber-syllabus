<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" role="img" aria-label="Personal data examples under GDPR">
  <rect width="540" height="250" fill="#FFF1D1"/>
  <text x="270" y="28" fill="#1A1410" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Personal data (GDPR Art. 4(1))</text>
  <rect x="30" y="50" width="480" height="50" rx="6" fill="#00B7CD" stroke="#1A1410" stroke-width="2"/>
  <text x="270" y="80" fill="#FFFBF0" font-size="13" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Any info about an identified OR identifiable person</text>
  <rect x="30" y="120" width="140" height="50" rx="6" fill="#ffffff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="100" y="150" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Name / ID</text>
  <rect x="190" y="120" width="140" height="50" rx="6" fill="#ffffff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="260" y="150" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Email / phone</text>
  <rect x="350" y="120" width="140" height="50" rx="6" fill="#ffffff" stroke="#1A1410" stroke-width="1.5"/>
  <text x="420" y="150" fill="#1A1410" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">IP / cookie ID</text>
  <text x="270" y="210" fill="#3D342C" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Even indirect identifiers count if a person can be singled out.</text>
</svg>