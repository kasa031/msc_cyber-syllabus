<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" role="img"><rect width="440" height="220" fill="#FFF1D1"/>
<text x="220" y="28" fill="#1A1410" font-size="15" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Unix permission bits</text>
<rect x="30" y="50" width="120" height="90" rx="4" fill="#FFE8B8" stroke="#1A1410" stroke-width="2"/>
<text x="90" y="80" fill="#1A1410" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Owner</text>
<text x="90" y="105" fill="#00B7CD" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">r w x</text>
<text x="90" y="128" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">4+2+1=7</text>
<rect x="160" y="50" width="120" height="90" rx="4" fill="#FFE8B8" stroke="#1A1410" stroke-width="2"/>
<text x="220" y="80" fill="#1A1410" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Group</text>
<text x="220" y="105" fill="#FF9100" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">r - -</text>
<text x="220" y="128" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">4+0+0=4</text>
<rect x="290" y="50" width="120" height="90" rx="4" fill="#FFE8B8" stroke="#1A1410" stroke-width="2"/>
<text x="350" y="80" fill="#1A1410" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Others</text>
<text x="350" y="105" fill="#DF301C" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">r - -</text>
<text x="350" y="128" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">4+0+0=4</text>
<text x="220" y="175" fill="#1A1410" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">chmod 644 → rw-r--r--</text>
<text x="220" y="200" fill="#3D342C" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">chmod 600 → rw-------</text>
</svg>
