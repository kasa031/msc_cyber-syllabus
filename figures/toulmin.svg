<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180" role="img"><rect width="420" height="180" fill="#FFF9E6"/>
<text x="210" y="26" fill="#5003C0" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Claim vs evidence (Toulmin)</text>
<rect x="30" y="55" width="150" height="80" rx="4" fill="#FFD51E" stroke="#5003C0" stroke-width="2"/>
<text x="105" y="90" fill="#5003C0" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Claim</text>
<text x="105" y="112" fill="#AB03A9" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">what you assert</text>
<rect x="240" y="55" width="150" height="80" rx="4" fill="#AB03A9" stroke="#5003C0" stroke-width="2"/>
<text x="315" y="90" fill="#FFFBF0" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Evidence</text>
<text x="315" y="112" fill="#FFF9E6" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">grounds / data</text>
<text x="210" y="160" fill="#AB03A9" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Warrant links evidence → claim</text>
</svg>
