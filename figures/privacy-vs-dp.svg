<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img"><rect width="420" height="200" fill="#FFF9E6"/>
<text x="210" y="26" fill="#5003C0" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Privacy vs data protection</text>
<rect x="30" y="55" width="160" height="100" rx="4" fill="#AB03A9" stroke="#5003C0" stroke-width="2"/>
<text x="110" y="95" fill="#FFFBF0" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Privacy</text>
<text x="110" y="120" fill="#FFF9E6" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">broader social</text>
<text x="110" y="138" fill="#FFF9E6" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">/ personal sphere</text>
<rect x="230" y="55" width="160" height="100" rx="4" fill="#FFD51E" stroke="#5003C0" stroke-width="2"/>
<text x="310" y="95" fill="#5003C0" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Data protection</text>
<text x="310" y="120" fill="#AB03A9" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">rules for</text>
<text x="310" y="138" fill="#AB03A9" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">personal data</text>
</svg>
