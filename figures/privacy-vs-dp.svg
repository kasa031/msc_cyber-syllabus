<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img"><rect width="420" height="200" fill="#97FEED"/>
<text x="210" y="26" fill="#1A1410" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Privacy vs data protection</text>
<rect x="30" y="55" width="160" height="100" rx="4" fill="#35A29F" stroke="#1A1410" stroke-width="2"/>
<text x="110" y="95" fill="#97FEED" font-size="14" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Privacy</text>
<text x="110" y="120" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">broader social</text>
<text x="110" y="138" fill="#97FEED" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">/ personal sphere</text>
<rect x="230" y="55" width="160" height="100" rx="4" fill="#0B666A" stroke="#1A1410" stroke-width="2"/>
<text x="310" y="95" fill="#1A1410" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Data protection</text>
<text x="310" y="120" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">rules for</text>
<text x="310" y="138" fill="#3D342C" font-size="11" font-weight="600" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">personal data</text>
</svg>
